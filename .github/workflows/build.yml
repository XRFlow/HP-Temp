name: Build packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Python deps
        run: python -m pip install -r requirements.txt PyQt6-Charts pyinstaller
      - name: Self-contained .deb
        run: ./scripts/build_deb_bundle.sh
      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: hptemp-linux
          path: build/hptemp_*_amd64.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python -m pip install -r requirements.txt PyQt6-Charts pyinstaller
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $iscc = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "::error::ISCC.exe missing after Inno Setup install"
            Get-ChildItem "C:\Program Files*\Inno Setup*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $iscc)
          Write-Host "ISCC=$iscc"
      - name: Install WiX v3 binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $zip = Join-Path $env:RUNNER_TEMP "wix314.zip"
          $dest = Join-Path $env:RUNNER_TEMP "wix3"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path -LiteralPath (Join-Path $dest "heat.exe"))) {
            Write-Host "::error::heat.exe missing in WiX binaries zip"
            Get-ChildItem $dest | ForEach-Object { Write-Host $_.Name }
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dest
          Write-Host "WiX=$dest"
      - name: Build Windows packages
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipDeps
      - name: Diagnose Windows failure
        if: failure()
        shell: pwsh
        run: |
          $bits = @()
          $bits += "python=$(python --version 2>&1)"
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $heat = Get-Command heat.exe -ErrorAction SilentlyContinue
          $bits += "iscc=$($iscc.Path)"
          $bits += "heat=$($heat.Path)"
          $bits += "dist=$(@(Get-ChildItem dist -ErrorAction SilentlyContinue | ForEach-Object Name) -join ',')"
          $bits += "inno=$(@(Get-ChildItem 'C:\Program Files*\Inno Setup*' -ErrorAction SilentlyContinue | ForEach-Object FullName) -join ',')"
          Write-Host "::error::windows-diagnose $($bits -join ' | ')"
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: hptemp-windows
          path: |
            dist/HPTemp-*-Setup.exe
            dist/HPTemp-*.msi
            dist/HPTemp-*-windows-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-bundle, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "HPTemp ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            artifacts/hptemp-linux/* \
            artifacts/hptemp-windows/*
