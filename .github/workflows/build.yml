name: Build packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packager
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build .deb
        run: ./scripts/build_deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: hptemp-deb
          path: build/hptemp_*_all.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python -m pip install -r requirements.txt pyinstaller
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/hptemp.spec
      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(python -c 'import sys; sys.path.insert(0,"src"); from hptemp import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build EXE installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" packaging\hptemp.iss
      - name: Install WiX
        run: choco install wixtoolset -y --no-progress
      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wix\heat.exe")) { $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin" }
          $env:PATH = "$wix;$env:PATH"
          heat.exe dir dist\HPTemp -cg AppFiles -gg -sfrag -srd -sreg -dr INSTALLFOLDER -out build\harvested.wxs
          candle.exe -nologo -arch x64 "-dProductVersion=${{ steps.version.outputs.value }}" "-dIconFile=$PWD\packaging\hptemp.ico" packaging\hptemp.wxs build\harvested.wxs -o build\
          light.exe -nologo build\hptemp.wixobj build\harvested.wixobj -o "dist\HPTemp-${{ steps.version.outputs.value }}.msi"
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path dist\HPTemp -DestinationPath "dist\HPTemp-${{ steps.version.outputs.value }}-windows-portable.zip"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hptemp-windows
          path: |
            dist/HPTemp-*-Setup.exe
            dist/HPTemp-*.msi
            dist/HPTemp-*-windows-portable.zip
