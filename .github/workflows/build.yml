name: Build packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Python deps
        run: python -m pip install -r requirements.txt PyQt6-Charts pyinstaller
      - name: Self-contained .deb
        run: ./scripts/build_deb_bundle.sh
      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: hptemp-linux
          path: build/hptemp_*_amd64.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup and WiX
        shell: pwsh
        run: |
          choco install innosetup wixtoolset -y --no-progress
          $paths = @(
            "$env:ProgramData\chocolatey\bin",
            "$env:ProgramFiles\Inno Setup 6",
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "$env:ProgramFiles\Inno Setup 7",
            "${env:ProgramFiles(x86)}\Inno Setup 7",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin",
            "$env:ProgramFiles\WiX Toolset v3.14\bin"
          )
          foreach ($p in $paths) {
            if ($p -and (Test-Path -LiteralPath $p)) {
              Add-Content -Path $env:GITHUB_PATH -Value $p
              Write-Host "Added to PATH: $p"
            }
          }
          Get-ChildItem "C:\Program Files\Inno Setup*" -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -ErrorAction SilentlyContinue
          Get-Command ISCC.exe -ErrorAction SilentlyContinue | Format-List
      - name: Build Windows packages
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: hptemp-windows
          path: |
            dist/HPTemp-*-Setup.exe
            dist/HPTemp-*.msi
            dist/HPTemp-*-windows-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-bundle, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "HPTemp ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            artifacts/hptemp-linux/* \
            artifacts/hptemp-windows/*
